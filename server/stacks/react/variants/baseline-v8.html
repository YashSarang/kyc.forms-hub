<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="kyc-expected-profile" content="B">
  <title>Full Canonical KYC Baseline — React / Next.js</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; background-color: #0b0f19; color: #f8fafc; padding: 20px; }
    .container { max-width: 950px; margin: 0 auto; background: #3e424c; padding: 35px; border-radius: 14px; border: 1px solid #0284c7; }
    h1 { color: #38bdf8; border-bottom: 2px solid #0284c7; padding-bottom: 12px; margin-top: 0; }
    .badge { display: inline-block; background: #0284c7; color: white; padding: 5px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; margin-bottom: 20px; }
    .desc { color: #94a3b8; margin-bottom: 20px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; color: #cbd5e1; font-size: 0.9rem; }
    input, select, textarea { width: 100%; padding: 11px; border-radius: 6px; border: 1px solid #0284c7; background: #0b0f19; color: white; font-size: 0.95rem; box-sizing: border-box; }
    input:focus, select:focus { outline: none; border-color: #38bdf8; box-shadow: 0 0 0 3px #38bdf833; }
    .radio-group, .checkbox-group { display: flex; gap: 15px; flex-wrap: wrap; margin-top: 5px; }
    .radio-group label, .checkbox-group label { font-weight: normal; display: flex; align-items: center; gap: 6px; }
    .btn-submit { background: linear-gradient(135deg, #0284c7, #38bdf8); color: white; border: none; padding: 14px 28px; font-size: 1.1rem; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 20px; }
    .result-box { margin-top: 25px; padding: 20px; background: #00000055; border-radius: 8px; border: 1px solid #0284c7; display: none; }
    
    /* --- Variation widget shared styles --- */
    .radio-inline .radio-group, .checkbox-inline .checkbox-group { gap: 20px; }
    .radio-cards .radio-group, .checkbox-cards .checkbox-group { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; }
    .radio-cards .radio-group label, .checkbox-cards .checkbox-group label { border: 1px solid #475569; border-radius: 8px; padding: 12px; cursor: pointer; transition: all 0.15s; }
    .radio-cards .radio-group label:has(input:checked), .checkbox-cards .checkbox-group label:has(input:checked) { border-color: #38bdf8; background: #0ea5e933; }
    .segmented-control { display: flex; border: 1px solid #475569; border-radius: 8px; overflow: hidden; }
    .segmented-control label { flex: 1; margin: 0; padding: 10px; text-align: center; cursor: pointer; border-right: 1px solid #475569; font-weight: 500; }
    .segmented-control label:last-child { border-right: none; }
    .segmented-control input { position: absolute; opacity: 0; }
    .segmented-control label:has(input:checked) { background: #38bdf8; color: #0f172a; font-weight: bold; }
    .toggle-switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .toggle-slider { width: 44px; height: 24px; background: #475569; border-radius: 24px; position: relative; transition: 0.2s; }
    .toggle-slider::before { content: ''; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; background: white; border-radius: 50%; transition: 0.2s; }
    .toggle-switch input:checked + .toggle-slider { background: #38bdf8; }
    .toggle-switch input:checked + .toggle-slider::before { transform: translateX(20px); }
    kyc-custom-select { display: block; position: relative; }
    .kyc-select-trigger { width: 100%; padding: 11px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; cursor: pointer; text-align: left; display: flex; justify-content: space-between; align-items: center; }
    .kyc-select-options { position: absolute; top: 100%; left: 0; right: 0; background: #1e293b; border: 1px solid #475569; border-radius: 6px; margin-top: 4px; max-height: 240px; overflow-y: auto; z-index: 100; display: none; }
    .kyc-select-options.open { display: block; }
    .kyc-select-option { padding: 10px 12px; cursor: pointer; }
    .kyc-select-option:hover, .kyc-select-option.active { background: #334155; }
    .kyc-triple-select { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .kyc-calendar-input { width: 100%; padding: 11px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; cursor: pointer; }
    .kyc-calendar-popup { position: absolute; top: 100%; left: 0; background: #1e293b; border: 1px solid #475569; border-radius: 8px; padding: 12px; z-index: 100; display: none; min-width: 280px; }
    .kyc-calendar-popup.open { display: block; }
    .kyc-calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .kyc-calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
    .kyc-calendar-day { padding: 6px; border-radius: 4px; cursor: pointer; }
    .kyc-calendar-day:hover { background: #334155; }
    .kyc-calendar-day.selected { background: #38bdf8; color: #0f172a; }
    .kyc-dropzone { border: 2px dashed #475569; border-radius: 8px; padding: 24px; text-align: center; cursor: pointer; transition: 0.2s; }
    .kyc-dropzone:hover, .kyc-dropzone.dragover { border-color: #38bdf8; background: #0ea5e91a; }
    .kyc-camera-btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; cursor: pointer; }
    .kyc-camera-btn:hover { border-color: #38bdf8; }
    input[type="file"] { color: #94a3b8; }
  
  </style>
  <script>
(function() {
  if (window.__KYC_WIDGETS_INIT__) return;
  window.__KYC_WIDGETS_INIT__ = true;

  window.collectWidgetValues = function(root) {
    const data = {};
    root.querySelectorAll('kyc-custom-select, kyc-date-triple, kyc-date-calendar, kyc-toggle, kyc-dropzone').forEach(el => {
      const input = el.querySelector('input[name]');
      if (input) {
        if (input.type === 'checkbox') data[input.name] = input.checked;
        else if (input.type === 'file') data[input.name] = input.files.length ? input.files[0].name : '';
        else data[input.name] = input.value;
      }
    });
    return data;
  };

  function dispatchInput(input) {
    input.dispatchEvent(new Event('input', { bubbles: true }));
    input.dispatchEvent(new Event('change', { bubbles: true }));
  }

  class KycCustomSelect extends HTMLElement {
    connectedCallback() {
      const name = this.getAttribute('name');
      this._options = JSON.parse(this.getAttribute('options') || '[]');
      const placeholder = this.getAttribute('placeholder') || 'Select...';
      const required = this.hasAttribute('required');
      const searchable = this.hasAttribute('searchable');
      this.innerHTML = '<input type="hidden" name="' + name + '"' + (required ? ' required' : '') + '><button type="button" class="kyc-select-trigger"><span class="kyc-select-text">' + placeholder + '</span><span>▼</span></button><div class="kyc-select-options"></div>';
      const optsEl = this.querySelector('.kyc-select-options');
      if (searchable) {
        const searchBox = document.createElement('input');
        searchBox.className = 'kyc-select-search';
        searchBox.placeholder = 'Type to filter...';
        searchBox.style.cssText = 'width:100%;padding:8px;border:none;border-bottom:1px solid #475569;background:#0f172a;color:white;box-sizing:border-box;';
        searchBox.addEventListener('input', (e) => this.filterOptions(e.target.value));
        searchBox.addEventListener('click', (e) => e.stopPropagation());
        optsEl.appendChild(searchBox);
      }
      this._options.forEach((opt) => {
        const div = document.createElement('div');
        div.className = 'kyc-select-option';
        div.textContent = opt;
        div.dataset.value = opt;
        div.addEventListener('click', () => this.select(opt));
        optsEl.appendChild(div);
      });
      this.querySelector('.kyc-select-trigger').addEventListener('click', (e) => { e.preventDefault(); this.toggle(); });
      document.addEventListener('click', (e) => { if (!this.contains(e.target)) optsEl.classList.remove('open'); });
    }
    filterOptions(query) {
      const q = (query || '').toLowerCase();
      this.querySelectorAll('.kyc-select-option').forEach(opt => {
        opt.style.display = opt.textContent.toLowerCase().includes(q) ? '' : 'none';
      });
    }
    select(value) {
      const input = this.querySelector('input');
      input.value = value;
      this.querySelector('.kyc-select-text').textContent = value;
      this.querySelector('.kyc-select-options').classList.remove('open');
      dispatchInput(input);
    }
    toggle() {
      this.querySelector('.kyc-select-options').classList.toggle('open');
    }
  }

  class KycDateTriple extends HTMLElement {
    connectedCallback() {
      const name = this.getAttribute('name');
      const required = this.hasAttribute('required');
      const daySel = '<select class="kyc-day"><option value="">Day</option>' + Array.from({length:31},(_,i)=>'<option value="'+(i+1)+'">'+(i+1)+'</option>').join('') + '</select>';
      const monthSel = '<select class="kyc-month"><option value="">Month</option>' + Array.from({length:12},(_,i)=>'<option value="'+(i+1)+'">'+(i+1)+'</option>').join('') + '</select>';
      const yearSel = '<select class="kyc-year"><option value="">Year</option>' + Array.from({length:100},(_,i)=>'<option value="'+(1925+i)+'">'+(1925+i)+'</option>').join('') + '</select>';
      this.innerHTML = '<input type="hidden" name="' + name + '"' + (required ? ' required' : '') + '><div class="kyc-triple-select">' + daySel + monthSel + yearSel + '</div>';
      const update = () => {
        const d = this.querySelector('.kyc-day').value;
        const m = this.querySelector('.kyc-month').value;
        const y = this.querySelector('.kyc-year').value;
        const input = this.querySelector('input');
        if (d && m && y) {
          input.value = String(d).padStart(2,'0') + '/' + String(m).padStart(2,'0') + '/' + y;
        } else input.value = '';
        dispatchInput(input);
      };
      this.querySelectorAll('select').forEach(s => s.addEventListener('change', update));
    }
  }

  class KycDateCalendar extends HTMLElement {
    connectedCallback() {
      const name = this.getAttribute('name');
      const required = this.hasAttribute('required');
      const placeholder = this.getAttribute('placeholder') || 'Pick a date...';
      this.innerHTML = '<input type="hidden" name="' + name + '"' + (required ? ' required' : '') + '><input type="text" readonly class="kyc-calendar-input" placeholder="' + placeholder + '"><div class="kyc-calendar-popup"></div>';
      this.viewDate = new Date();
      this.selectedDate = null;
      this.input = this.querySelector('input[type="hidden"]');
      this.display = this.querySelector('.kyc-calendar-input');
      this.popup = this.querySelector('.kyc-calendar-popup');
      this.display.addEventListener('click', () => { this.render(); this.popup.classList.toggle('open'); });
      document.addEventListener('click', (e) => { if (!this.contains(e.target)) this.popup.classList.remove('open'); });
    }
    render() {
      const y = this.viewDate.getFullYear();
      const m = this.viewDate.getMonth();
      const firstDay = new Date(y, m, 1).getDay();
      const daysInMonth = new Date(y, m + 1, 0).getDate();
      let html = '<div class="kyc-calendar-header"><button type="button" class="kyc-cal-prev">‹</button><span>' + (m+1) + '/' + y + '</span><button type="button" class="kyc-cal-next">›</button></div>';
      html += '<div class="kyc-calendar-grid">' + ['Su','Mo','Tu','We','Th','Fr','Sa'].map(d => '<div style="font-weight:bold;">' + d + '</div>').join('') + '</div>';
      const grid = document.createElement('div'); grid.className = 'kyc-calendar-grid';
      for (let i = 0; i < firstDay; i++) grid.appendChild(document.createElement('div'));
      for (let d = 1; d <= daysInMonth; d++) {
        const cell = document.createElement('div');
        cell.className = 'kyc-calendar-day';
        cell.textContent = d;
        if (this.selectedDate && this.selectedDate.getDate() === d && this.selectedDate.getMonth() === m && this.selectedDate.getFullYear() === y) cell.classList.add('selected');
        cell.addEventListener('click', () => { this.pick(d); });
        grid.appendChild(cell);
      }
      this.popup.innerHTML = html;
      this.popup.appendChild(grid);
      this.popup.querySelector('.kyc-cal-prev').addEventListener('click', (e) => { e.stopPropagation(); this.viewDate.setMonth(m - 1); this.render(); });
      this.popup.querySelector('.kyc-cal-next').addEventListener('click', (e) => { e.stopPropagation(); this.viewDate.setMonth(m + 1); this.render(); });
    }
    pick(day) {
      const y = this.viewDate.getFullYear();
      const m = this.viewDate.getMonth();
      this.selectedDate = new Date(y, m, day);
      this.input.value = String(day).padStart(2,'0') + '/' + String(m+1).padStart(2,'0') + '/' + y;
      this.display.value = this.input.value;
      this.popup.classList.remove('open');
      dispatchInput(this.input);
    }
  }

  class KycToggle extends HTMLElement {
    connectedCallback() {
      const name = this.getAttribute('name');
      const label = this.getAttribute('label') || '';
      const required = this.hasAttribute('required');
      this.innerHTML = '<label class="toggle-switch"><input type="checkbox" name="' + name + '"' + (required ? ' required' : '') + '><span class="toggle-slider"></span><span>' + label + '</span></label>';
    }
  }

  class KycDropzone extends HTMLElement {
    connectedCallback() {
      const name = this.getAttribute('name');
      const accept = this.getAttribute('accept') || '';
      const label = this.getAttribute('label') || 'Drag & drop files here or click to upload';
      this.innerHTML = '<input type="file" name="' + name + '" style="display:none;" ' + (accept ? 'accept="' + accept + '"' : '') + '><div class="kyc-dropzone">' + label + '</div>';
      const input = this.querySelector('input');
      const zone = this.querySelector('.kyc-dropzone');
      zone.addEventListener('click', () => input.click());
      zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('dragover'); });
      zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
      zone.addEventListener('drop', (e) => { e.preventDefault(); zone.classList.remove('dragover'); if (e.dataTransfer.files.length) input.files = e.dataTransfer.files; dispatchInput(input); });
      input.addEventListener('change', () => { zone.textContent = input.files.length ? input.files[0].name : label; dispatchInput(input); });
    }
  }

  customElements.define('kyc-custom-select', KycCustomSelect);
  customElements.define('kyc-date-triple', KycDateTriple);
  customElements.define('kyc-date-calendar', KycDateCalendar);
  customElements.define('kyc-toggle', KycToggle);
  customElements.define('kyc-dropzone', KycDropzone);
})();
</script>
  
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;
    const initialState = {"full_name":"","first_name":"","middle_name":"","last_name":"","preferred_name":"","gender":"","dob":"","age":38,"nationality":"","marital_status":"","mobile_number":"","alternate_mobile":"","landline":"","email":"","curr_address_line1":"","curr_address_line2":"","curr_landmark":"","curr_city":"","curr_district":"","curr_state":"","curr_pincode":"","curr_country":"","same_as_current":false,"perm_address_line1":"","perm_city":"","perm_state":"","perm_pincode":"","aadhaar_number":"","pan_number":"","passport_number":"","driving_licence":"","voter_id":"","bank_name":"","branch_name":"","account_number":"","ifsc_code":"","account_type":"","occupation":"","employment_type":"","employer_name":"","designation":"","industry":"","annual_income":"","income_range":"","net_worth":"","is_pep":"","nominee_name":"","nominee_relationship":"","nominee_dob":"","nominee_share":"","father_name":"","mother_name":"","spouse_name":"","emergency_contact_name":"","emergency_contact_phone":"","upload_pan":"","upload_aadhaar_front":"","upload_aadhaar_back":"","upload_photo":"","upload_signature":"","mobile_otp":"","email_otp":"","esign_consent":false,"terms_consent":false,"customer_id":"CUST-772910","branch_code":"BR-BLR-002","agent_id":"","referral_code":"","dob_dmy_text":"","dob_mdy_text":"","dob_ymd_text":"","dob_dmy_selects":"","dob_calendar":"","nominee_dob_dmy_text":"","month_year":"","nationality_custom":"","bank_name_custom":"","marital_status_segmented":"","income_range_searchable":"","gender_radio_inline":"","gender_radio_cards":"","account_type_segmented":"","account_type_cards":"","esign_consent_toggle":"","terms_consent_card":"","same_as_current_toggle":"","upload_pan_dropzone":"","upload_aadhaar_multiple":"","upload_photo_camera":""};

    function honeypotField(name) {
      return <input type="text" name={name} style={{ position: 'absolute', left: '-9999px' }} tabIndex={-1} autoComplete="off" />;
    }

    function KycForm() {
      const [formData, setFormData] = useState(initialState);
      const [report, setReport] = useState(null);
      const [disabled, setDisabled] = useState(!!window.__KYC_DELAY_MS__);

      useEffect(() => {
        if (window.__KYC_DELAY_MS__) {
          const t = setTimeout(() => setDisabled(false), window.__KYC_DELAY_MS__);
          return () => clearTimeout(t);
        }
      }, []);

      const handleChange = (e) => {
        const { name, value, type, checked } = e.target;
        setFormData(prev => ({ ...prev, [name]: type === 'checkbox' ? checked : value }));
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        const widgetValues = window.collectWidgetValues ? window.collectWidgetValues(e.target) : {};
        const payload = { ...formData, ...widgetValues };
        const res = await fetch('http://localhost:3000/api/verify-submission', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ scenarioId: 'baseline', variantId: 'baseline-v8', data: payload })
        });
        const result = await res.json();
        setReport(result.report);
        const agentId = new URLSearchParams(window.location.search).get('agentId') || 'anonymous-agent';
        await fetch('http://localhost:3000/api/benchmark/run', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ agentId, agentName: agentId, scenarioId: 'baseline', variantId: 'baseline-v8', stack: 'react', data: payload, report: result.report, metadata: { source: 'form-submission' } })
        });
      };

      return (
        <div className="container">
          <span className="badge">React / Next.js (30% share)</span>
          <h1>Full Canonical KYC Baseline</h1>
          <p className="desc">Complete 50+ field KYC form across all categories. Used as the repeatable baseline for cross-stack comparison.</p>
          <form onSubmit={handleSubmit} noValidate>
            <div className="grid-2">
      <div className="form-group" data-field-id="full_name">
        <label>Full Name *</label>
        <input type="text" name="full_name" value={formData.full_name} onChange={handleChange} placeholder="e.g. Rajesh Kumar Sharma" required />
      </div>
      <div className="form-group" data-field-id="first_name">
        <label>First Name *</label>
        <input type="text" name="first_name" value={formData.first_name} onChange={handleChange} placeholder="Rajesh" required />
      </div>
      <div className="form-group" data-field-id="middle_name">
        <label>Middle Name</label>
        <input type="text" name="middle_name" value={formData.middle_name} onChange={handleChange} placeholder="Kumar"  />
      </div>
      <div className="form-group" data-field-id="last_name">
        <label>Last Name *</label>
        <input type="text" name="last_name" value={formData.last_name} onChange={handleChange} placeholder="Sharma" required />
      </div>
      <div className="form-group" data-field-id="preferred_name">
        <label>Preferred Name</label>
        <input type="text" name="preferred_name" value={formData.preferred_name} onChange={handleChange} placeholder="Raj"  />
      </div>
      <div className="form-group" data-field-id="gender">
        <label>Gender *</label>
        <div className="radio-group"><label key="Male"><input type="radio" name="gender" value="Male" checked={formData.gender === 'Male'} onChange={handleChange} required /> Male</label><label key="Female"><input type="radio" name="gender" value="Female" checked={formData.gender === 'Female'} onChange={handleChange} required /> Female</label><label key="Other"><input type="radio" name="gender" value="Other" checked={formData.gender === 'Other'} onChange={handleChange} required /> Other</label><label key="Prefer not to say"><input type="radio" name="gender" value="Prefer not to say" checked={formData.gender === 'Prefer not to say'} onChange={handleChange} required /> Prefer not to say</label></div>
      </div>
      <div className="form-group" data-field-id="dob">
        <label>Date of Birth *</label>
        <input type="date" name="dob" value={formData.dob} onChange={handleChange}  required />
      </div>
      <div className="form-group" data-field-id="age">
        <label>Age</label>
        <input type="number" name="age" value={formData.age} onChange={handleChange}   />
      </div>
      <div className="form-group" data-field-id="nationality">
        <label>Nationality *</label>
        <select name="nationality" value={formData.nationality} onChange={handleChange} required><option value="" disabled>Select...</option><option value="Indian">Indian</option><option value="American">American</option><option value="British">British</option><option value="Canadian">Canadian</option><option value="Other">Other</option></select>
      </div>
      <div className="form-group" data-field-id="marital_status">
        <label>Marital Status *</label>
        <select name="marital_status" value={formData.marital_status} onChange={handleChange} required><option value="" disabled>Select...</option><option value="Single">Single</option><option value="Married">Married</option><option value="Divorced">Divorced</option><option value="Widowed">Widowed</option></select>
      </div>
      <div className="form-group" data-field-id="mobile_number">
        <label>Mobile Number *</label>
        <input type="tel" name="mobile_number" value={formData.mobile_number} onChange={handleChange} placeholder="9876543210" required />
      </div>
      <div className="form-group" data-field-id="alternate_mobile">
        <label>Alternate Mobile</label>
        <input type="tel" name="alternate_mobile" value={formData.alternate_mobile} onChange={handleChange} placeholder="9876543211"  />
      </div>
      <div className="form-group" data-field-id="landline">
        <label>Landline Number</label>
        <input type="tel" name="landline" value={formData.landline} onChange={handleChange} placeholder="02228901234"  />
      </div>
      <div className="form-group" data-field-id="email">
        <label>Email Address *</label>
        <input type="email" name="email" value={formData.email} onChange={handleChange} placeholder="rajesh.sharma@example.com" required />
      </div>
      <div className="form-group" data-field-id="curr_address_line1">
        <label>Current Address Line 1 *</label>
        <input type="text" name="curr_address_line1" value={formData.curr_address_line1} onChange={handleChange} placeholder="Flat 402, Sunshine Apartments" required />
      </div>
      <div className="form-group" data-field-id="curr_address_line2">
        <label>Current Address Line 2</label>
        <input type="text" name="curr_address_line2" value={formData.curr_address_line2} onChange={handleChange} placeholder="MG Road, Kandivali West"  />
      </div>
      <div className="form-group" data-field-id="curr_landmark">
        <label>Landmark</label>
        <input type="text" name="curr_landmark" value={formData.curr_landmark} onChange={handleChange} placeholder="Near Metro Station"  />
      </div>
      <div className="form-group" data-field-id="curr_city">
        <label>City *</label>
        <input type="text" name="curr_city" value={formData.curr_city} onChange={handleChange} placeholder="Mumbai" required />
      </div>
      <div className="form-group" data-field-id="curr_district">
        <label>District *</label>
        <input type="text" name="curr_district" value={formData.curr_district} onChange={handleChange} placeholder="Mumbai Suburban" required />

      <div className="form-group" data-field-id="curr_state">

        <select name="curr_state" value={formData.curr_state} onChange={handleChange} required><option value="" disabled>Select...</option><option value="Maharashtra">Maharashtra</option><option value="Delhi">Delhi</option><option value="Karnataka">Karnataka</option><option value="Tamil Nadu">Tamil Nadu</option><option value="Telangana">Telangana</option><option value="Gujarat">Gujarat</option></select>
      </div>
      <div className="form-group" data-field-id="curr_pincode">
        <label>PIN Code *</label>
        <input type="text" name="curr_pincode" value={formData.curr_pincode} onChange={handleChange} placeholder="400067" required />
      </div>
      <div className="form-group" data-field-id="curr_country">
        <label>Country *</label>
        <select name="curr_country" value={formData.curr_country} onChange={handleChange} required><option value="" disabled>Select...</option><option value="India">India</option><option value="United States">United States</option><option value="United Kingdom">United Kingdom</option></select>
      </div>
      <div className="form-group" data-field-id="same_as_current">
        <label>Permanent address same as current address</label>
        <label><input type="checkbox" name="same_as_current" checked={formData.same_as_current} onChange={handleChange}  /> Permanent address same as current address</label>
      </div>
      <div className="form-group" data-field-id="perm_address_line1">
        <label>Permanent Address Line 1</label>
        <input type="text" name="perm_address_line1" value={formData.perm_address_line1} onChange={handleChange}   />
      </div>
      <div className="form-group" data-field-id="perm_city">
        <label>Permanent City</label>
        <input type="text" name="perm_city" value={formData.perm_city} onChange={handleChange}   />
      </div>
      <div className="form-group" data-field-id="perm_state">
        <label>Permanent State</label>
        <select name="perm_state" value={formData.perm_state} onChange={handleChange} ><option value="" disabled>Select...</option><option value="Maharashtra">Maharashtra</option><option value="Delhi">Delhi</option><option value="Karnataka">Karnataka</option><option value="Tamil Nadu">Tamil Nadu</option><option value="Telangana">Telangana</option><option value="Gujarat">Gujarat</option></select>
      </div>
      <div className="form-group" data-field-id="perm_pincode">
        <label>Permanent PIN Code</label>
        <input type="text" name="perm_pincode" value={formData.perm_pincode} onChange={handleChange}   />
      </div>
      <div className="form-group" data-field-id="aadhaar_number">
        <label>Aadhaar Number *</label>
        <input type="text" id="aadhaar_number" name="aadhaar_number" value="" placeholder="1234 5678 9012" required />
      </div>
      <div className="form-group" data-field-id="pan_number">
        <label>PAN Number *</label>
        <input type="text" id="pan_number" name="pan_number" value="" placeholder="ABCDE1234F" required />
      </div>
      <div className="form-group" data-field-id="passport_number">
        <label>Passport Number</label>
        <input type="text" name="passport_number" value={formData.passport_number} onChange={handleChange} placeholder="Z1234567"  />
      </div>
      <div className="form-group" data-field-id="driving_licence">
        <label>Driving Licence Number</label>
        <input type="text" name="driving_licence" value={formData.driving_licence} onChange={handleChange} placeholder="MH0220190012345"  />
      </div>
      <div className="form-group" data-field-id="voter_id">
        <label>Voter ID</label>
        <input type="text" name="voter_id" value={formData.voter_id} onChange={handleChange} placeholder="XYZ9876543"  />
      </div>
      <div className="form-group" data-field-id="bank_name">
        <label>Bank Name *</label>
        <select name="bank_name" value={formData.bank_name} onChange={handleChange} required><option value="" disabled>Select...</option><option value="State Bank of India">State Bank of India</option><option value="HDFC Bank">HDFC Bank</option><option value="ICICI Bank">ICICI Bank</option><option value="Axis Bank">Axis Bank</option><option value="Kotak Mahindra Bank">Kotak Mahindra Bank</option></select>
      </div>
      <div className="form-group" data-field-id="branch_name">
        <label>Branch Name *</label>
        <input type="text" name="branch_name" value={formData.branch_name} onChange={handleChange} placeholder="Fort Branch, Mumbai" required />
      </div>
      <div className="form-group" data-field-id="account_number">
        <label>Account Number *</label>
        <input type="text" name="account_number" value={formData.account_number} onChange={handleChange} placeholder="100234567890" required />
      </div>
      <div className="form-group" data-field-id="ifsc_code">
        <label>IFSC Code *</label>
        <input type="text" name="ifsc_code" value={formData.ifsc_code} onChange={handleChange} placeholder="SBIN0000300" required />
      </div>
      <div className="form-group" data-field-id="account_type">
        <label>Account Type *</label>
        <div className="radio-group"><label key="Savings"><input type="radio" name="account_type" value="Savings" checked={formData.account_type === 'Savings'} onChange={handleChange} required /> Savings</label><label key="Current"><input type="radio" name="account_type" value="Current" checked={formData.account_type === 'Current'} onChange={handleChange} required /> Current</label><label key="Salary"><input type="radio" name="account_type" value="Salary" checked={formData.account_type === 'Salary'} onChange={handleChange} required /> Salary</label></div>
      </div>
      <div className="form-group" data-field-id="occupation">
        <label>Occupation *</label>
        <input type="text" name="occupation" value={formData.occupation} onChange={handleChange} placeholder="Software Engineer" required />
      </div>
      <div className="form-group" data-field-id="employment_type">
        <label>Employment Type *</label>
        <select name="employment_type" value={formData.employment_type} onChange={handleChange} required><option value="" disabled>Select...</option><option value="Salaried">Salaried</option><option value="Self-Employed">Self-Employed</option><option value="Business Owner">Business Owner</option><option value="Student">Student</option><option value="Retired">Retired</option></select>
      </div>
      <div className="form-group" data-field-id="employer_name">
        <label>Employer Name</label>
        <input type="text" name="employer_name" value={formData.employer_name} onChange={handleChange} placeholder="Tech Solutions Pvt Ltd"  />
      </div>
      <div className="form-group" data-field-id="designation">
        <label>Designation</label>
        <input type="text" name="designation" value={formData.designation} onChange={handleChange} placeholder="Senior Developer"  />
      </div>
      <div className="form-group" data-field-id="industry">
        <label>Industry</label>
        <input type="text" name="industry" value={formData.industry} onChange={handleChange} placeholder="Information Technology"  />
      </div>
      <div className="form-group" data-field-id="annual_income">
        <label>Annual Income (INR) *</label>
        <input type="number" name="annual_income" value={formData.annual_income} onChange={handleChange} placeholder="1200000" required />
      </div>
      <div className="form-group" data-field-id="income_range">
        <label>Income Range *</label>
        <select name="income_range" value={formData.income_range} onChange={handleChange} required><option value="" disabled>Select...</option><option value="Below 1 Lakh">Below 1 Lakh</option><option value="1-5 Lakhs">1-5 Lakhs</option><option value="5-10 Lakhs">5-10 Lakhs</option><option value="10-25 Lakhs">10-25 Lakhs</option><option value="Above 25 Lakhs">Above 25 Lakhs</option></select>
      </div>
      <div className="form-group" data-field-id="net_worth">
        <label>Net Worth (INR)</label>
        <input type="number" name="net_worth" value={formData.net_worth} onChange={handleChange} placeholder="5000000"  />
      </div>
      <div className="form-group" data-field-id="is_pep">
        <label>Politically Exposed Person (PEP) *</label>
        <div className="radio-group"><label key="No"><input type="radio" name="is_pep" value="No" checked={formData.is_pep === 'No'} onChange={handleChange} required /> No</label><label key="Yes"><input type="radio" name="is_pep" value="Yes" checked={formData.is_pep === 'Yes'} onChange={handleChange} required /> Yes</label></div>
      </div>
      <div className="form-group" data-field-id="nominee_name">
        <label>Nominee Name *</label>
        <input type="text" name="nominee_name" value={formData.nominee_name} onChange={handleChange} placeholder="Priya Sharma" required />
      </div>
      <div className="form-group" data-field-id="nominee_relationship">
        <label>Nominee Relationship *</label>
        <select name="nominee_relationship" value={formData.nominee_relationship} onChange={handleChange} required><option value="" disabled>Select...</option><option value="Spouse">Spouse</option><option value="Father">Father</option><option value="Mother">Mother</option><option value="Son">Son</option><option value="Daughter">Daughter</option><option value="Brother">Brother</option><option value="Sister">Sister</option></select>
      </div>
      <div className="form-group" data-field-id="nominee_dob">
        <label>Nominee Date of Birth *</label>
        <input type="date" name="nominee_dob" value={formData.nominee_dob} onChange={handleChange}  required />
      </div>
      <div className="form-group" data-field-id="nominee_share">
        <label>Nominee Share (%) *</label>
        <input type="number" name="nominee_share" value={formData.nominee_share} onChange={handleChange} placeholder="100" required />
      </div>
      <div className="form-group" data-field-id="father_name">
        <label>Father's Name *</label>
        <input type="text" name="father_name" value={formData.father_name} onChange={handleChange} placeholder="Ramesh Sharma" required />
      </div>
      <div className="form-group" data-field-id="mother_name">
        <label>Mother's Name *</label>
        <input type="text" name="mother_name" value={formData.mother_name} onChange={handleChange} placeholder="Sunita Sharma" required />
      </div>
      <div className="form-group" data-field-id="spouse_name">
        <label>Spouse Name</label>
        <input type="text" name="spouse_name" value={formData.spouse_name} onChange={handleChange} placeholder="Priya Sharma"  />
      </div>
      <div className="form-group" data-field-id="emergency_contact_name">
        <label>Emergency Contact Name *</label>
        <input type="text" name="emergency_contact_name" value={formData.emergency_contact_name} onChange={handleChange} placeholder="Ramesh Sharma" required />
      </div>
      <div className="form-group" data-field-id="emergency_contact_phone">
        <label>Emergency Contact Phone *</label>
        <input type="tel" name="emergency_contact_phone" value={formData.emergency_contact_phone} onChange={handleChange} placeholder="9876500000" required />
      </div>
      <div className="form-group" data-field-id="upload_pan">
        <label>PAN Card Document</label>
        <input type="file" name="upload_pan" onChange={handleChange}  />
      </div>
      <div className="form-group" data-field-id="upload_aadhaar_front">
        <label>Aadhaar Front</label>
        <input type="file" name="upload_aadhaar_front" onChange={handleChange}  />
      </div>
      <div className="form-group" data-field-id="upload_aadhaar_back">
        <label>Aadhaar Back</label>
        <input type="file" name="upload_aadhaar_back" onChange={handleChange}  />
      </div>
      <div className="form-group" data-field-id="upload_photo">
        <label>Applicant Photo / Selfie</label>
        <input type="file" name="upload_photo" onChange={handleChange}  />
      </div>
      <div className="form-group" data-field-id="upload_signature">
        <label>Applicant Specimen Signature</label>
        <input type="file" name="upload_signature" onChange={handleChange}  />
      </div>
      <div className="form-group" data-field-id="mobile_otp">
        <label>Mobile OTP Code *</label>
        <input type="text" name="mobile_otp" value={formData.mobile_otp} onChange={handleChange} placeholder="123456" required />
      </div>
      <div className="form-group" data-field-id="email_otp">
        <label>Email OTP Code *</label>
        <input type="text" name="email_otp" value={formData.email_otp} onChange={handleChange} placeholder="654321" required />
      </div>
      <div className="form-group" data-field-id="esign_consent">
        <label>I consent to digital Aadhaar eSign verification *</label>
        <label><input type="checkbox" name="esign_consent" checked={formData.esign_consent} onChange={handleChange} required /> I consent to digital Aadhaar eSign verification</label>
      </div>
      <div className="form-group" data-field-id="terms_consent">
        <label>I agree to Terms & Conditions and Privacy Policy *</label>
        <label><input type="checkbox" name="terms_consent" checked={formData.terms_consent} onChange={handleChange} required /> I agree to Terms & Conditions and Privacy Policy</label>
      </div>
      <div className="form-group" data-field-id="customer_id">
        <label>Customer ID</label>
        <input type="text" name="customer_id" value={formData.customer_id} onChange={handleChange}   />
      </div>
      <div className="form-group" data-field-id="branch_code">
        <label>Branch Code</label>
        <input type="text" name="branch_code" value={formData.branch_code} onChange={handleChange}   />
      </div>
      <div className="form-group" data-field-id="agent_id">
        <label>Agent ID</label>
        <input type="text" name="agent_id" value={formData.agent_id} onChange={handleChange} placeholder="AGT-4402"  />
      </div>
      <div className="form-group" data-field-id="referral_code">
        <label>Referral Code</label>
        <input type="text" name="referral_code" value={formData.referral_code} onChange={handleChange} placeholder="REF-KYC2026"  />
      </div>
      <div className="form-group" data-field-id="dob_dmy_text">
        <label>Date of Birth (DD/MM/YYYY) *</label>
        <input type="text" id="dob_dmy_text" name="dob_dmy_text" value="" placeholder="18/07/1985" required pattern="^[0-9]{1,4}[/-][0-9]{1,4}[/-][0-9]{1,4}$" />
      </div>
      <div className="form-group" data-field-id="dob_mdy_text">
        <label>Date of Birth (MM/DD/YYYY) *</label>
        <input type="text" id="dob_mdy_text" name="dob_mdy_text" value="" placeholder="07/18/1985" required pattern="^[0-9]{1,4}[/-][0-9]{1,4}[/-][0-9]{1,4}$" />
      </div>
      <div className="form-group" data-field-id="dob_ymd_text">
        <label>Date of Birth (YYYY-MM-DD) *</label>
        <input type="text" id="dob_ymd_text" name="dob_ymd_text" value="" placeholder="1985-07-18" required pattern="^[0-9]{1,4}[/-][0-9]{1,4}[/-][0-9]{1,4}$" />
      </div>
      <div className="form-group" data-field-id="dob_dmy_selects">
        <label>Date of Birth (Day / Month / Year) *</label>
        <kyc-date-triple name="dob_dmy_selects" required></kyc-date-triple>
      </div>
      <div className="form-group" data-field-id="dob_calendar">
        <label>Date of Birth (Calendar) *</label>
        <kyc-date-calendar name="dob_calendar" placeholder="Pick a date..." required></kyc-date-calendar>
      </div>
      <div className="form-group" data-field-id="nominee_dob_dmy_text">
        <label>Nominee Date of Birth (DD/MM/YYYY) *</label>
        <input type="text" id="nominee_dob_dmy_text" name="nominee_dob_dmy_text" value="" placeholder="12/04/1987" required pattern="^[0-9]{1,4}[/-][0-9]{1,4}[/-][0-9]{1,4}$" />
      </div>
      <div className="form-group" data-field-id="month_year">
        <label>Month / Year</label>
        <input type="text" id="month_year" name="month_year" value="" placeholder="07/1985" pattern="^[0-9]{1,2}[/-][0-9]{4}$" />
      </div>
      <div className="form-group" data-field-id="nationality_custom">
        <label>Nationality (Custom Dropdown) *</label>
        <kyc-custom-select name="nationality_custom" options="[&quot;Indian&quot;,&quot;American&quot;,&quot;British&quot;,&quot;Canadian&quot;,&quot;Other&quot;]" placeholder="Select..." required></kyc-custom-select>
      </div>
      <div className="form-group" data-field-id="bank_name_custom">
        <label>Bank Name (Custom Dropdown) *</label>
        <kyc-custom-select name="bank_name_custom" options="[&quot;State Bank of India&quot;,&quot;HDFC Bank&quot;,&quot;ICICI Bank&quot;,&quot;Axis Bank&quot;,&quot;Kotak Mahindra Bank&quot;]" placeholder="Select..." required></kyc-custom-select>
      </div>
      <div className="form-group" data-field-id="marital_status_segmented">
        <label>Marital Status (Segmented) *</label>
        <div className="segmented-control"><label><input type="radio" name="marital_status_segmented" value="Single" required> Single</label><label><input type="radio" name="marital_status_segmented" value="Married" required> Married</label><label><input type="radio" name="marital_status_segmented" value="Divorced" required> Divorced</label><label><input type="radio" name="marital_status_segmented" value="Widowed" required> Widowed</label></div>
      </div>
      <div className="form-group" data-field-id="income_range_searchable">
        <label>Income Range (Searchable) *</label>
        <kyc-custom-select searchable name="income_range_searchable" options="[&quot;Below 1 Lakh&quot;,&quot;1-5 Lakhs&quot;,&quot;5-10 Lakhs&quot;,&quot;10-25 Lakhs&quot;,&quot;Above 25 Lakhs&quot;]" placeholder="Search income range..." required></kyc-custom-select>
      </div>
      <div className="form-group" data-field-id="gender_radio_inline">
        <label>Gender (Inline Radio) *</label>
        <div className="radio-inline"><div className="radio-group"><label><input type="radio" name="gender_radio_inline" value="Male" required> Male</label><label><input type="radio" name="gender_radio_inline" value="Female" required> Female</label><label><input type="radio" name="gender_radio_inline" value="Other" required> Other</label><label><input type="radio" name="gender_radio_inline" value="Prefer not to say" required> Prefer not to say</label></div></div>
      </div>
      <div className="form-group" data-field-id="gender_radio_cards">
        <label>Gender (Card Selection) *</label>
        <div className="radio-cards"><div className="radio-group"><label><input type="radio" name="gender_radio_cards" value="Male" required> Male</label><label><input type="radio" name="gender_radio_cards" value="Female" required> Female</label><label><input type="radio" name="gender_radio_cards" value="Other" required> Other</label><label><input type="radio" name="gender_radio_cards" value="Prefer not to say" required> Prefer not to say</label></div></div>
      </div>
      <div className="form-group" data-field-id="account_type_segmented">
        <label>Account Type (Segmented) *</label>
        <div className="segmented-control"><label><input type="radio" name="account_type_segmented" value="Savings" required> Savings</label><label><input type="radio" name="account_type_segmented" value="Current" required> Current</label><label><input type="radio" name="account_type_segmented" value="Salary" required> Salary</label></div>
      </div>
      <div className="form-group" data-field-id="account_type_cards">
        <label>Account Type (Cards) *</label>
        <div className="radio-cards"><div className="radio-group"><label><input type="radio" name="account_type_cards" value="Savings" required> Savings</label><label><input type="radio" name="account_type_cards" value="Current" required> Current</label><label><input type="radio" name="account_type_cards" value="Salary" required> Salary</label></div></div>
      </div>
      <div className="form-group" data-field-id="esign_consent_toggle">
        <label>I consent to digital Aadhaar eSign verification *</label>
        <kyc-toggle name="esign_consent_toggle" label="I consent to digital Aadhaar eSign verification" required></kyc-toggle>
      </div>
      <div className="form-group" data-field-id="terms_consent_card">
        <label>I agree to Terms & Conditions and Privacy Policy *</label>
        <div className="checkbox-cards"><div className="checkbox-group"><label><input type="checkbox" id="terms_consent_card" name="terms_consent_card" required> I agree to Terms &amp; Conditions and Privacy Policy</label></div></div>
      </div>
      <div className="form-group" data-field-id="same_as_current_toggle">
        <label>Permanent address same as current address</label>
        <kyc-toggle name="same_as_current_toggle" label="Permanent address same as current address"></kyc-toggle>
      </div>
      <div className="form-group" data-field-id="upload_pan_dropzone">
        <label>PAN Card Document (Dropzone)</label>
        <kyc-dropzone name="upload_pan_dropzone" accept=".jpg,.png,.pdf" label="Drag & drop PAN Card Document (Dropzone) here or click to upload"></kyc-dropzone>
      </div>
      <div className="form-group" data-field-id="upload_aadhaar_multiple">
        <label>Aadhaar Documents (Multiple)</label>
        <input type="file" id="upload_aadhaar_multiple" name="upload_aadhaar_multiple" multiple accept=".jpg,.png,.pdf" />
      </div>
      <div className="form-group" data-field-id="upload_photo_camera">
        <label>Applicant Photo (Camera)</label>
        <label className="kyc-camera-btn"><input type="file" id="upload_photo_camera" name="upload_photo_camera" accept="image/*" capture="user" style="display:none;">📷 Applicant Photo (Camera)</label>
      </div>
            </div>
            
            <button type="submit" className="btn-submit" id="realSubmit" disabled={disabled}>Submit Form</button>
          </form>
          {report && (
            <div className="result-box">
              <h3 style={{ color: '#38bdf8', marginTop: 0 }}>Score: {report.score}/100</h3>
              <pre style={{ color: '#a7f3d0', whiteSpace: 'pre-wrap' }}>{JSON.stringify(report, null, 2)}</pre>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<KycForm />);
  </script>
</body>
</html>
