<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Level 2 — Selection Controls — React / Next.js</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; background-color: #0b0f19; color: #f8fafc; padding: 20px; }
    .container { max-width: 950px; margin: 0 auto; background: #3e424c; padding: 35px; border-radius: 14px; border: 1px solid #0284c7; }
    h1 { color: #38bdf8; border-bottom: 2px solid #0284c7; padding-bottom: 12px; margin-top: 0; }
    .badge { display: inline-block; background: #0284c7; color: white; padding: 5px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; margin-bottom: 20px; }
    .desc { color: #94a3b8; margin-bottom: 20px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; color: #cbd5e1; font-size: 0.9rem; }
    input, select, textarea { width: 100%; padding: 11px; border-radius: 6px; border: 1px solid #0284c7; background: #0b0f19; color: white; font-size: 0.95rem; box-sizing: border-box; }
    input:focus, select:focus { outline: none; border-color: #38bdf8; box-shadow: 0 0 0 3px #38bdf833; }
    .radio-group, .checkbox-group { display: flex; gap: 15px; flex-wrap: wrap; margin-top: 5px; }
    .radio-group label, .checkbox-group label { font-weight: normal; display: flex; align-items: center; gap: 6px; }
    .btn-submit { background: linear-gradient(135deg, #0284c7, #38bdf8); color: white; border: none; padding: 14px 28px; font-size: 1.1rem; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 20px; }
    .result-box { margin-top: 25px; padding: 20px; background: #00000055; border-radius: 8px; border: 1px solid #0284c7; display: none; }
  </style>
  
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;
    const initialState = {"full_name":"Rajesh Kumar Sharma","gender":"Male","nationality":"Indian","marital_status":"Married","account_type":"Savings","esign_consent":true,"terms_consent":true};

    function honeypotField(name) {
      return <input type="text" name={name} style={{ position: 'absolute', left: '-9999px' }} tabIndex={-1} autoComplete="off" />;
    }

    function KycForm() {
      const [formData, setFormData] = useState(initialState);
      const [report, setReport] = useState(null);
      const [disabled, setDisabled] = useState(!!window.__KYC_DELAY_MS__);

      useEffect(() => {
        if (window.__KYC_DELAY_MS__) {
          const t = setTimeout(() => setDisabled(false), window.__KYC_DELAY_MS__);
          return () => clearTimeout(t);
        }
      }, []);

      const handleChange = (e) => {
        const { name, value, type, checked } = e.target;
        setFormData(prev => ({ ...prev, [name]: type === 'checkbox' ? checked : value }));
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        const res = await fetch('/api/verify-submission', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ scenarioId: 'level2-selection', variantId: 'level2-selection-v4', data: formData })
        });
        const result = await res.json();
        setReport(result.report);
      };

      return (
        <div className="container">
          <span className="badge">React / Next.js (30% share)</span>
          <h1>Level 2 — Selection Controls</h1>
          <p className="desc">Tests native dropdowns, radio buttons, checkboxes, and toggle-style controls.</p>
          <form onSubmit={handleSubmit}>
            <div className="grid-2">
      <div className="form-group" data-field-id="full_name">
        <label>Full Name *</label>
        <input type="text" name="full_name" value={formData.full_name} onChange={handleChange} placeholder="e.g. Rajesh Kumar Sharma" required />
      </div>
      <div className="form-group" data-field-id="gender">
        <label>Gender *</label>
        <div className="radio-group"><label key="Male"><input type="radio" name="gender" value="Male" checked={formData.gender === 'Male'} onChange={handleChange} required /> Male</label><label key="Female"><input type="radio" name="gender" value="Female" checked={formData.gender === 'Female'} onChange={handleChange} required /> Female</label><label key="Other"><input type="radio" name="gender" value="Other" checked={formData.gender === 'Other'} onChange={handleChange} required /> Other</label><label key="Prefer not to say"><input type="radio" name="gender" value="Prefer not to say" checked={formData.gender === 'Prefer not to say'} onChange={handleChange} required /> Prefer not to say</label></div>
      </div>
      <div className="form-group" data-field-id="nationality">
        <label>Nationality *</label>
        <select name="nationality" value={formData.nationality} onChange={handleChange} required><option value="Indian">Indian</option><option value="American">American</option><option value="British">British</option><option value="Canadian">Canadian</option><option value="Other">Other</option></select>
      </div>
      <div className="form-group" data-field-id="marital_status">
        <label>Marital Status *</label>
        <select name="marital_status" value={formData.marital_status} onChange={handleChange} required><option value="Single">Single</option><option value="Married">Married</option><option value="Divorced">Divorced</option><option value="Widowed">Widowed</option></select>
      </div>
      <div className="form-group" data-field-id="account_type">
        <label>Account Type *</label>
        <div className="radio-group"><label key="Savings"><input type="radio" name="account_type" value="Savings" checked={formData.account_type === 'Savings'} onChange={handleChange} required /> Savings</label><label key="Current"><input type="radio" name="account_type" value="Current" checked={formData.account_type === 'Current'} onChange={handleChange} required /> Current</label><label key="Salary"><input type="radio" name="account_type" value="Salary" checked={formData.account_type === 'Salary'} onChange={handleChange} required /> Salary</label></div>
      </div>
      <div className="form-group" data-field-id="esign_consent">
        <label>I consent to digital Aadhaar eSign verification *</label>
        <label><input type="checkbox" name="esign_consent" checked={formData.esign_consent} onChange={handleChange} required /> I consent to digital Aadhaar eSign verification</label>
      </div>
      <div className="form-group" data-field-id="terms_consent">
        <label>I agree to Terms & Conditions and Privacy Policy *</label>
        <label><input type="checkbox" name="terms_consent" checked={formData.terms_consent} onChange={handleChange} required /> I agree to Terms & Conditions and Privacy Policy</label>
      </div>
            </div>
            
            <button type="submit" className="btn-submit" id="realSubmit" disabled={disabled}>Submit Form</button>
          </form>
          {report && (
            <div className="result-box">
              <h3 style={{ color: '#38bdf8', marginTop: 0 }}>Score: {report.score}/100</h3>
              <pre style={{ color: '#a7f3d0', whiteSpace: 'pre-wrap' }}>{JSON.stringify(report, null, 2)}</pre>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<KycForm />);
  </script>
</body>
</html>
