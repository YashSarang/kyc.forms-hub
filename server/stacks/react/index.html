<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="React controlled-component KYC benchmark form — full canonical field suite for AI agent evaluation.">
  <title>React KYC Benchmark — Cyan Electric</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --primary: #06b6d4;
      --accent:  #22d3ee;
      --bg:      #060e14;
      --surface: #0d1b26;
      --border:  #0e3347;
      --text:    #e0f7fa;
      --muted:   #7dd3e8;
      --input-bg:#071218;
    }

    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px 16px;
      min-height: 100vh;
    }

    /* ── Stack Identity Banner ── */
    .stack-banner {
      max-width: 1020px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, #0891b2 0%, #0e7490 100%);
      border-radius: 14px;
      padding: 18px 28px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 8px 32px rgba(6,182,212,0.25);
    }
    .stack-logo { font-size: 2.2rem; line-height: 1; }
    .stack-banner-info h2 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: 0.02em;
    }
    .stack-banner-info p {
      margin: 2px 0 0;
      font-size: 0.82rem;
      color: #cffafe;
      font-weight: 500;
    }
    .stack-share-pill {
      margin-left: auto;
      background: rgba(255,255,255,0.15);
      color: #fff;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .container {
      max-width: 1020px;
      margin: 0 auto;
      background: var(--surface);
      padding: 36px 40px;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(6,182,212,0.08);
    }

    h1 {
      color: var(--accent);
      margin: 0 0 28px;
      font-size: 1.7rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    /* ── Tab Nav ── */
    .tabs-nav {
      display: flex;
      gap: 6px;
      border-bottom: 2px solid var(--border);
      margin-bottom: 32px;
      overflow-x: auto;
      padding-bottom: 0;
      scrollbar-width: none;
    }
    .tabs-nav::-webkit-scrollbar { display: none; }
    .tab-btn {
      background: transparent;
      color: var(--muted);
      border: none;
      border-bottom: 3px solid transparent;
      padding: 10px 18px;
      margin-bottom: -2px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
      white-space: nowrap;
      transition: all 0.2s;
      font-family: inherit;
    }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-btn:hover:not(.active) { color: var(--text); }

    /* ── Progress Bar ── */
    .progress-wrap {
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin-bottom: 32px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      border-radius: 2px;
      transition: width 0.35s ease;
    }

    .section-title {
      color: var(--accent);
      font-size: 1.05rem;
      font-weight: 700;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
      margin: 0 0 22px;
    }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }

    .form-group { margin-bottom: 18px; }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: var(--muted);
      font-size: 0.85rem;
    }
    input[type="text"], input[type="email"], input[type="tel"],
    input[type="date"], input[type="number"], input[type="file"], select {
      width: 100%;
      padding: 11px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text);
      font-size: 0.95rem;
      font-family: inherit;
      transition: border 0.2s, box-shadow 0.2s;
    }
    input:focus, select:focus {
      border-color: var(--accent);
      outline: none;
      box-shadow: 0 0 0 3px rgba(34,211,238,0.15);
    }
    select option { background: var(--surface); }

    .radio-group, .checkbox-group { display: flex; gap: 18px; margin-top: 6px; flex-wrap: wrap; }
    .radio-group label, .checkbox-group label {
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--text);
      font-size: 0.92rem;
    }
    input[type="radio"], input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; }

    /* ── Nav Actions ── */
    .nav-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 36px;
      border-top: 1px solid var(--border);
      padding-top: 22px;
    }
    .btn-secondary {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 11px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-family: inherit;
      font-size: 0.92rem;
      transition: all 0.2s;
    }
    .btn-secondary:hover { background: var(--border); color: var(--text); }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), #0891b2);
      color: #fff;
      border: none;
      padding: 12px 30px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.95rem;
      font-family: inherit;
      transition: opacity 0.2s, transform 0.1s;
      box-shadow: 0 4px 16px rgba(6,182,212,0.3);
    }
    .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }

    .result-box {
      margin-top: 32px;
      padding: 26px;
      background: var(--bg);
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .result-box h3 { color: var(--accent); margin-top: 0; }
    .result-box pre { color: #a7f3d0; font-size: 0.85rem; overflow-x: auto; }

    @media (max-width: 640px) {
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
      .container { padding: 22px 18px; }
    }
  </style>
</head>
<body>
  <!-- Stack Identity Banner -->
  <div class="stack-banner">
    <div class="stack-logo">⚛️</div>
    <div class="stack-banner-info">
      <h2>React — Controlled Components</h2>
      <p>Theme: <strong>Cyan Electric</strong> &nbsp;·&nbsp; CDN Babel / React 18 &nbsp;·&nbsp; useState hooks</p>
    </div>
    <span class="stack-share-pill">30% Market Share · Port 3011</span>
  </div>

  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const SECTIONS = [
      { id: 'identity',  title: '1. Personal Identity' },
      { id: 'contact',   title: '2. Contact & Address' },
      { id: 'documents', title: '3. Identity Documents' },
      { id: 'banking',   title: '4. Banking & Financials' },
      { id: 'nominee',   title: '5. Nominee & Family' },
      { id: 'uploads',   title: '6. Uploads & Verification' }
    ];

    function ReactFullKycForm() {
      const [activeTab, setActiveTab] = useState('identity');
      const [formData, setFormData] = useState({
        full_name:              'Rajesh Kumar Sharma',
        first_name:             'Rajesh',
        middle_name:            'Kumar',
        last_name:              'Sharma',
        preferred_name:         'Raj',
        gender:                 'Male',
        dob:                    '1992-08-15',
        nationality:            'Indian',
        marital_status:         'Married',
        spouse_name:            'Priya Sharma',

        mobile_number:          '9876543210',
        alternate_mobile:       '9876543211',
        landline:               '02228901234',
        email:                  'rajesh.sharma@example.com',
        curr_address_line1:     'Flat 402, Sunshine Apartments',
        curr_address_line2:     'MG Road, Kandivali West',
        curr_landmark:          'Near Metro Station',
        curr_city:              'Mumbai',
        curr_district:          'Mumbai Suburban',
        curr_state:             'Maharashtra',
        curr_pincode:           '400067',
        curr_country:           'India',
        same_as_current:        true,

        pan_number:             'ABCDE1234F',
        aadhaar_number:         '123456789012',
        passport_number:        'Z1234567',
        driving_licence:        'MH0220190012345',
        voter_id:               'XYZ9876543',

        bank_name:              'State Bank of India',
        branch_name:            'Fort Branch, Mumbai',
        account_number:         '100234567890',
        ifsc_code:              'SBIN0000300',
        account_type:           'Savings',
        occupation:             'Software Engineer',
        employment_type:        'Salaried',
        employer_name:          'Tech Solutions Pvt Ltd',
        designation:            'Senior Developer',
        industry:               'Information Technology',
        annual_income:          '1200000',
        income_range:           '10-25 Lakhs',
        net_worth:              '5000000',
        is_pep:                 'No',

        nominee_name:           'Priya Sharma',
        nominee_relationship:   'Spouse',
        nominee_dob:            '1994-05-20',
        nominee_share:          '100',
        father_name:            'Ramesh Sharma',
        mother_name:            'Sunita Sharma',
        emergency_contact_name: 'Ramesh Sharma',
        emergency_contact_phone:'9876500000',

        mobile_otp:             '123456',
        email_otp:              '654321',
        esign_consent:          true,
        terms_consent:          true
      });

      const [report, setReport] = useState(null);

      const handleChange = (e) => {
        const { name, value, type, checked } = e.target;
        setFormData(prev => ({ ...prev, [name]: type === 'checkbox' ? checked : value }));
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        const res = await fetch('/api/verify-submission', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ data: formData })
        });
        const result = await res.json();
        setReport(result.report);
      };

      const activeIdx = SECTIONS.findIndex(s => s.id === activeTab);
      const progress = Math.round(((activeIdx + 1) / SECTIONS.length) * 100);

      const goTo = (idx) => {
        if (idx >= 0 && idx < SECTIONS.length) setActiveTab(SECTIONS[idx].id);
      };

      return (
        <div className="container">
          <h1>React KYC Benchmark Application</h1>

          <div className="tabs-nav">
            {SECTIONS.map(s => (
              <button
                key={s.id}
                type="button"
                className={`tab-btn ${activeTab === s.id ? 'active' : ''}`}
                onClick={() => setActiveTab(s.id)}
              >
                {s.title}
              </button>
            ))}
          </div>

          <div className="progress-wrap">
            <div className="progress-bar" style={{ width: `${progress}%` }} />
          </div>

          <form onSubmit={handleSubmit}>
            {/* Section 1: Personal Identity */}
            {activeTab === 'identity' && (
              <div>
                <h3 className="section-title">Personal Identity Details</h3>
                <div className="grid-2">
                  <div className="form-group">
                    <label htmlFor="full_name">Full Name *</label>
                    <input type="text" id="full_name" name="full_name" value={formData.full_name} onChange={handleChange} required />
                  </div>
                  <div className="form-group">
                    <label htmlFor="preferred_name">Preferred Name</label>
                    <input type="text" id="preferred_name" name="preferred_name" value={formData.preferred_name} onChange={handleChange} />
                  </div>
                </div>
                <div className="grid-3">
                  <div className="form-group">
                    <label htmlFor="first_name">First Name *</label>
                    <input type="text" id="first_name" name="first_name" value={formData.first_name} onChange={handleChange} required />
                  </div>
                  <div className="form-group">
                    <label htmlFor="middle_name">Middle Name</label>
                    <input type="text" id="middle_name" name="middle_name" value={formData.middle_name} onChange={handleChange} />
                  </div>
                  <div className="form-group">
                    <label htmlFor="last_name">Last Name *</label>
                    <input type="text" id="last_name" name="last_name" value={formData.last_name} onChange={handleChange} required />
                  </div>
                </div>
                <div className="grid-3">
                  <div className="form-group">
                    <label>Gender *</label>
                    <div className="radio-group">
                      {['Male', 'Female', 'Other'].map(g => (
                        <label key={g}><input type="radio" name="gender" value={g} checked={formData.gender === g} onChange={handleChange} required /> {g}</label>
                      ))}
                    </div>
                  </div>
                  <div className="form-group">
                    <label htmlFor="dob">Date of Birth *</label>
                    <input type="date" id="dob" name="dob" value={formData.dob} onChange={handleChange} required />
                  </div>
                  <div className="form-group">
                    <label htmlFor="nationality">Nationality *</label>
                    <select id="nationality" name="nationality" value={formData.nationality} onChange={handleChange} required>
                      <option value="Indian">Indian</option>
                      <option value="American">American</option>
                      <option value="British">British</option>
                    </select>
                  </div>
                </div>
                <div className="grid-2">
                  <div className="form-group">
                    <label htmlFor="marital_status">Marital Status *</label>
                    <select id="marital_status" name="marital_status" value={formData.marital_status} onChange={handleChange} required>
                      <option value="Single">Single</option>
                      <option value="Married">Married</option>
                      <option value="Divorced">Divorced</option>
                    </select>
                  </div>
                  {formData.marital_status === 'Married' && (
                    <div className="form-group">
                      <label htmlFor="spouse_name">Spouse Name *</label>
                      <input type="text" id="spouse_name" name="spouse_name" value={formData.spouse_name} onChange={handleChange} required />
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* Section 2: Contact & Address */}
            {activeTab === 'contact' && (
              <div>
                <h3 className="section-title">Contact & Communication Address</h3>
                <div className="grid-3">
                  <div className="form-group">
                    <label htmlFor="email">Email Address *</label>
                    <input type="email" id="email" name="email" value={formData.email} onChange={handleChange} required />
                  </div>
                  <div className="form-group">
                    <label htmlFor="mobile_number">Mobile Number *</label>
                    <input type="tel" id="mobile_number" name="mobile_number" value={formData.mobile_number} onChange={handleChange} required />
                  </div>
                  <div className="form-group">
                    <label htmlFor="alternate_mobile">Alternate Mobile</label>
                    <input type="tel" id="alternate_mobile" name="alternate_mobile" value={formData.alternate_mobile} onChange={handleChange} />
                  </div>
                </div>
                <div className="grid-2">
                  <div className="form-group">
                    <label htmlFor="curr_address_line1">Current Address Line 1 *</label>
                    <input type="text" id="curr_address_line1" name="curr_address_line1" value={formData.curr_address_line1} onChange={handleChange} required />
                  </div>
                  <div className="form-group">
                    <label htmlFor="curr_address_line2">Current Address Line 2</label>
                    <input type="text" id="curr_address_line2" name="curr_address_line2" value={formData.curr_address_line2} onChange={handleChange} />
                  </div>
                </div>
                <div className="grid-3">
                  <div className="form-group">
                    <label htmlFor="curr_city">City *</label>
                    <input type="text" id="curr_city" name="curr_city" value={formData.curr_city} onChange={handleChange} required />
                  </div>
                  <div className="form-group">
                    <label htmlFor="curr_state">State *</label>
                    <select id="curr_state" name="curr_state" value={formData.curr_state} onChange={handleChange} required>
                      <option value="Maharashtra">Maharashtra</option>
                      <option value="Delhi">Delhi</option>
                      <option value="Karnataka">Karnataka</option>
                      <option value="Tamil Nadu">Tamil Nadu</option>
                      <option value="Gujarat">Gujarat</option>
                    </select>
                  </div>
                  <div className="form-group">
                    <label htmlFor="curr_pincode">PIN Code *</label>
                    <input type="text" id="curr_pincode" name="curr_pincode" value={formData.curr_pincode} onChange={handleChange} required />
                  </div>
                </div>
                <div className="form-group">
                  <label className="checkbox-group" style={{cursor:'pointer'}}>
                    <input type="checkbox" id="same_as_current" name="same_as_current" checked={formData.same_as_current} onChange={handleChange} />
                    Permanent address is same as current address
                  </label>
                </div>
              </div>
            )}

            {/* Section 3: Identity Documents */}
            {activeTab === 'documents' && (
              <div>
                <h3 className="section-title">Government Identity Documents</h3>
                <div className="grid-2">
                  <div className="form-group">
                    <label htmlFor="pan_number">PAN Number *</label>
                    <input type="text" id="pan_number" name="pan_number" value={formData.pan_number} onChange={handleChange} required />
                  </div>
                  <div className="form-group">
                    <label htmlFor="aadhaar_number">Aadhaar Number *</label>
                    <input type="text" id="aadhaar_number" name="aadhaar_number" value={formData.aadhaar_number} onChange={handleChange} required />
                  </div>
                </div>
                <div className="grid-3">
                  <div className="form-group">
                    <label htmlFor="passport_number">Passport Number</label>
                    <input type="text" id="passport_number" name="passport_number" value={formData.passport_number} onChange={handleChange} />
                  </div>
                  <div className="form-group">
                    <label htmlFor="driving_licence">Driving Licence Number</label>
                    <input type="text" id="driving_licence" name="driving_licence" value={formData.driving_licence} onChange={handleChange} />
                  </div>
                  <div className="form-group">
                    <label htmlFor="voter_id">Voter ID</label>
                    <input type="text" id="voter_id" name="voter_id" value={formData.voter_id} onChange={handleChange} />
                  </div>
                </div>
              </div>
            )}

            {/* Section 4: Banking & Financials */}
            {activeTab === 'banking' && (
              <div>
                <h3 className="section-title">Banking & Financial Profile</h3>
                <div className="grid-2">
                  <div className="form-group">
                    <label htmlFor="bank_name">Bank Name *</label>
                    <select id="bank_name" name="bank_name" value={formData.bank_name} onChange={handleChange} required>
                      <option value="State Bank of India">State Bank of India</option>
                      <option value="HDFC Bank">HDFC Bank</option>
                      <option value="ICICI Bank">ICICI Bank</option>
                      <option value="Axis Bank">Axis Bank</option>
                    </select>
                  </div>
                  <div className="form-group">
                    <label htmlFor="branch_name">Branch Name *</label>
                    <input type="text" id="branch_name" name="branch_name" value={formData.branch_name} onChange={handleChange} required />
                  </div>
                </div>
                <div className="grid-3">
                  <div className="form-group">
                    <label htmlFor="account_number">Account Number *</label>
                    <input type="text" id="account_number" name="account_number" value={formData.account_number} onChange={handleChange} required />
                  </div>
                  <div className="form-group">
                    <label htmlFor="ifsc_code">IFSC Code *</label>
                    <input type="text" id="ifsc_code" name="ifsc_code" value={formData.ifsc_code} onChange={handleChange} required />
                  </div>
                  <div className="form-group">
                    <label>Account Type *</label>
                    <div className="radio-group">
                      <label><input type="radio" name="account_type" value="Savings" checked={formData.account_type === 'Savings'} onChange={handleChange} /> Savings</label>
                      <label><input type="radio" name="account_type" value="Current" checked={formData.account_type === 'Current'} onChange={handleChange} /> Current</label>
                    </div>
                  </div>
                </div>
                <div className="grid-3">
                  <div className="form-group">
                    <label htmlFor="occupation">Occupation *</label>
                    <input type="text" id="occupation" name="occupation" value={formData.occupation} onChange={handleChange} required />
                  </div>
                  <div className="form-group">
                    <label htmlFor="annual_income">Annual Income (INR) *</label>
                    <input type="number" id="annual_income" name="annual_income" value={formData.annual_income} onChange={handleChange} required />
                  </div>
                  <div className="form-group">
                    <label>Politically Exposed Person (PEP) *</label>
                    <div className="radio-group">
                      <label><input type="radio" name="is_pep" value="No" checked={formData.is_pep === 'No'} onChange={handleChange} /> No</label>
                      <label><input type="radio" name="is_pep" value="Yes" checked={formData.is_pep === 'Yes'} onChange={handleChange} /> Yes</label>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* Section 5: Nominee & Family */}
            {activeTab === 'nominee' && (
              <div>
                <h3 className="section-title">Nominee & Family Information</h3>
                <div className="grid-2">
                  <div className="form-group">
                    <label htmlFor="nominee_name">Nominee Name *</label>
                    <input type="text" id="nominee_name" name="nominee_name" value={formData.nominee_name} onChange={handleChange} required />
                  </div>
                  <div className="form-group">
                    <label htmlFor="nominee_relationship">Relationship *</label>
                    <select id="nominee_relationship" name="nominee_relationship" value={formData.nominee_relationship} onChange={handleChange} required>
                      <option value="Spouse">Spouse</option>
                      <option value="Father">Father</option>
                      <option value="Mother">Mother</option>
                      <option value="Son">Son</option>
                      <option value="Daughter">Daughter</option>
                    </select>
                  </div>
                </div>
                <div className="grid-3">
                  <div className="form-group">
                    <label htmlFor="father_name">Father's Name *</label>
                    <input type="text" id="father_name" name="father_name" value={formData.father_name} onChange={handleChange} required />
                  </div>
                  <div className="form-group">
                    <label htmlFor="mother_name">Mother's Name *</label>
                    <input type="text" id="mother_name" name="mother_name" value={formData.mother_name} onChange={handleChange} required />
                  </div>
                  <div className="form-group">
                    <label htmlFor="emergency_contact_phone">Emergency Contact Phone *</label>
                    <input type="tel" id="emergency_contact_phone" name="emergency_contact_phone" value={formData.emergency_contact_phone} onChange={handleChange} required />
                  </div>
                </div>
              </div>
            )}

            {/* Section 6: Uploads & Verification */}
            {activeTab === 'uploads' && (
              <div>
                <h3 className="section-title">Upload Documents & Verification OTP</h3>
                <div className="grid-2">
                  <div className="form-group">
                    <label htmlFor="upload_pan">PAN Card Document *</label>
                    <input type="file" id="upload_pan" name="upload_pan" />
                  </div>
                  <div className="form-group">
                    <label htmlFor="upload_aadhaar_front">Aadhaar Front Copy *</label>
                    <input type="file" id="upload_aadhaar_front" name="upload_aadhaar_front" />
                  </div>
                </div>
                <div className="grid-2">
                  <div className="form-group">
                    <label htmlFor="mobile_otp">Mobile OTP Code *</label>
                    <input type="text" id="mobile_otp" name="mobile_otp" value={formData.mobile_otp} onChange={handleChange} required />
                  </div>
                  <div className="form-group">
                    <label htmlFor="email_otp">Email OTP Code *</label>
                    <input type="text" id="email_otp" name="email_otp" value={formData.email_otp} onChange={handleChange} required />
                  </div>
                </div>
                <div className="form-group">
                  <label className="checkbox-group" style={{cursor:'pointer'}}>
                    <input type="checkbox" id="esign_consent" name="esign_consent" checked={formData.esign_consent} onChange={handleChange} required />
                    Consent to digital Aadhaar eSign verification
                  </label>
                </div>
                <div className="form-group">
                  <label className="checkbox-group" style={{cursor:'pointer'}}>
                    <input type="checkbox" id="terms_consent" name="terms_consent" checked={formData.terms_consent} onChange={handleChange} required />
                    Agree to Terms & Conditions and Privacy Policy
                  </label>
                </div>
              </div>
            )}

            <div className="nav-actions">
              {activeIdx > 0 ? (
                <button type="button" className="btn-secondary" onClick={() => goTo(activeIdx - 1)}>← Previous</button>
              ) : <div />}

              {activeIdx < SECTIONS.length - 1 ? (
                <button type="button" className="btn-primary" onClick={() => goTo(activeIdx + 1)}>Next →</button>
              ) : (
                <button type="submit" className="btn-primary" id="submitBtn">Submit React KYC →</button>
              )}
            </div>
          </form>

          {report && (
            <div className="result-box">
              <h3>⚛️ React Evaluation Score: {report.score}/100</h3>
              <pre>{JSON.stringify(report, null, 2)}</pre>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ReactFullKycForm />);
  </script>
</body>
</html>
