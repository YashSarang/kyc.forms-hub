<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Issue Variant — Fake Submit Buttons — Plain HTML / jQuery</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; background-color: #0f172a; color: #f8fafc; padding: 20px; }
    .container { max-width: 950px; margin: 0 auto; background: #424a5d; padding: 35px; border-radius: 14px; border: 1px solid #0284c7; }
    h1 { color: #38bdf8; border-bottom: 2px solid #0284c7; padding-bottom: 12px; margin-top: 0; }
    .badge { display: inline-block; background: #0284c7; color: white; padding: 5px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; margin-bottom: 20px; }
    .desc { color: #94a3b8; margin-bottom: 20px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; color: #cbd5e1; font-size: 0.9rem; }
    input, select, textarea { width: 100%; padding: 11px; border-radius: 6px; border: 1px solid #0284c7; background: #0f172a; color: white; font-size: 0.95rem; box-sizing: border-box; }
    input:focus, select:focus { outline: none; border-color: #38bdf8; box-shadow: 0 0 0 3px #38bdf833; }
    .radio-group, .checkbox-group { display: flex; gap: 15px; flex-wrap: wrap; margin-top: 5px; }
    .radio-group label, .checkbox-group label { font-weight: normal; display: flex; align-items: center; gap: 6px; }
    .btn-submit { background: linear-gradient(135deg, #0284c7, #38bdf8); color: white; border: none; padding: 14px 28px; font-size: 1.1rem; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 20px; }
    .result-box { margin-top: 25px; padding: 20px; background: #00000055; border-radius: 8px; border: 1px solid #0284c7; display: none; }
  </style>
  
</head>
<body>
  <div class="container">
    <span class="badge">Plain HTML / jQuery (20% share)</span>
    <h1>Issue Variant — Fake Submit Buttons</h1>
    <p class="desc">Decoy submit-styled buttons test whether the agent can identify the real submit control.</p>
    <form id="kycForm" data-scenario="issue-fake-buttons">
      <div class="grid-2"><div class="form-group " data-field-id="full_name">
      <label for="full_name">Full Name *</label>
      <input type="text" id="full_name" name="full_name" value="Rajesh Kumar Sharma" placeholder="e.g. Rajesh Kumar Sharma" required />
    </div>
        <div class="form-group " data-field-id="email">
      <label for="email">Email Address *</label>
      <input type="email" id="email" name="email" value="rajesh.sharma@example.com" required />
    </div>
        <div class="form-group " data-field-id="mobile_number">
      <label for="mobile_number">Mobile Number *</label>
      <input type="tel" id="mobile_number" name="mobile_number" value="9876543210" required />
    </div>
        <div class="form-group " data-field-id="terms_consent">
      <label for="terms_consent">I agree to Terms & Conditions *</label>
      <label><input type="checkbox" id="terms_consent" name="terms_consent" checked required> I agree to Terms & Conditions</label>
    </div></div>
      <button type="button" class="btn-submit fake-submit" style="background:#7f1d1d;margin-bottom:10px;">Submit Application 1</button>
      <button type="button" class="btn-submit fake-submit" style="background:#7f1d1d;margin-bottom:10px;">Submit Application 2</button>
      <button type="button" class="btn-submit fake-submit" style="background:#7f1d1d;margin-bottom:10px;">Submit Application 3</button>
      <button type="submit" class="btn-submit" id="realSubmit">Submit Form</button>
    </form>
    <div class="result-box" id="resultBox">
      <h3 style="color:#38bdf8; margin-top:0;">Score: <span id="scoreVal"></span>/100</h3>
      <pre id="resultJson" style="color:#a7f3d0; white-space:pre-wrap;"></pre>
    </div>
  </div>
  <script>
    function collectData(root) {
      root = root || document.getElementById('kycForm');
      const data = {};
      function walk(node) {
        if (node.shadowRoot) walk(node.shadowRoot);
        if (node.tagName === 'INPUT' || node.tagName === 'SELECT' || node.tagName === 'TEXTAREA') {
          const name = node.getAttribute('name');
          if (!name) return;
          if (node.type === 'checkbox') data[name] = node.checked;
          else if (node.type === 'radio') { if (node.checked) data[name] = node.value; }
          else data[name] = node.value;
        }
        Array.from(node.children).forEach(child => walk(child));
      }
      walk(root);
      return data;
    }
    $(function() {
      if (window.__KYC_DELAY_MS__) {
        $('#kycForm input, #kycForm select').prop('disabled', true);
        setTimeout(() => $('#kycForm input, #kycForm select').prop('disabled', false), window.__KYC_DELAY_MS__);
      }
      $('#kycForm').on('submit', function(e) {
        e.preventDefault();
        $.ajax({ url: '/api/verify-submission', type: 'POST', contentType: 'application/json',
          data: JSON.stringify({ scenarioId: 'issue-fake-buttons', variantId: 'issue-fake-buttons-v3', data: collectData() }),
          success: r => { $('#resultBox').show(); $('#scoreVal').text(r.report.score); $('#resultJson').text(JSON.stringify(r.report, null, 2)); }
        });
      });
    });
  </script>
  
</body>
</html>
